name: Build and Release Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests pillow scipy sounddevice numpy pyperclip opencc-python-reimplemented

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "GroqVoiceTool" voice_input.pyw

    - name: Compress Build Output
      shell: powershell
      run: |
        Compress-Archive -Path dist/GroqVoiceTool/* -DestinationPath GroqVoiceTool.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: GroqVoiceTool.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
